<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>炭火焼ホルモン 松楽｜山形駅前</title>

<style>

/* ==================================================
   RESET
================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#f4efe6;
  color:#211c18;

  font-family:
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}


/* ==================================================
   HEADER
================================================== */

.header{
  position:relative;
  z-index:100;

  width:100%;
  height:94px;

  display:flex;
  align-items:center;

  padding:0 5vw;

  background:#f4efe6;

  border-bottom:
    1px solid rgba(40,30,20,.07);
}


/* LOGO */

.logo{
  flex-shrink:0;
}

.logo img{
  display:block;

  width:88px;
  height:auto;
}


/* PC NAV */

.pc-nav{
  margin-left:auto;

  display:flex;
  align-items:center;

  gap:34px;

  font-size:14px;
  font-weight:600;

  letter-spacing:.06em;
}

.pc-nav a{
  transition:opacity .2s;
}

.pc-nav a:hover{
  opacity:.55;
}


/* HEADER RESERVE */

.header-reserve{
  margin-left:32px;

  display:flex;
  align-items:center;
  justify-content:center;

  height:50px;

  padding:0 26px;

  border-radius:999px;

  background:#bd4d2d;
  color:#fff;

  font-size:14px;
  font-weight:700;
}


/* HAMBURGER */

.menu-btn{
  display:none;

  margin-left:auto;

  width:54px;
  height:54px;

  border:0;
  border-radius:50%;

  background:#fff;

  box-shadow:
    0 5px 20px rgba(0,0,0,.06);

  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:6px;

  cursor:pointer;
}

.menu-btn span{
  display:block;

  width:23px;
  height:2px;

  background:#211c18;
}


/* ==================================================
   HERO
================================================== */

.hero{
  width:100%;
  min-height:calc(100svh - 94px);

  display:grid;

  grid-template-columns:
    52%
    48%;

  background:#f4efe6;
}


/* ==================================================
   HERO COPY
================================================== */

.hero-copy{
  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:
    70px
    7vw
    70px
    8vw;
}


.hero-en{
  margin-bottom:26px;

  font-size:11px;

  letter-spacing:.30em;

  color:#93624d;
}


.hero-title{
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:
    clamp(44px,5vw,74px);

  font-weight:500;

  line-height:1.4;

  letter-spacing:.03em;

  margin-bottom:24px;
}


.hero-description{
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:16px;

  line-height:1.9;

  color:#645950;

  margin-bottom:35px;
}


/* ==================================================
   BUTTONS
================================================== */

.hero-buttons{
  display:flex;

  gap:12px;

  flex-wrap:wrap;
}


.btn{
  min-width:170px;
  height:54px;

  padding:0 24px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:999px;

  font-size:14px;
  font-weight:700;

  transition:
    transform .2s,
    opacity .2s;
}


.btn:hover{
  transform:translateY(-2px);
}


.btn-main{
  background:#bd4d2d;
  color:#fff;
}


.btn-sub{
  background:transparent;

  border:
    1px solid rgba(40,30,20,.20);
}


.instagram-link{
  margin-top:27px;

  font-size:12px;

  letter-spacing:.09em;

  color:#756a62;
}


/* ==================================================
   VIDEO
================================================== */

.hero-video{
  position:relative;

  min-height:
    calc(100svh - 94px);

  overflow:hidden;

  background:#111;
}


.hero-video video{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center;
}


/* 少しだけ動画左側をなじませる */

.hero-video::after{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      to right,
      rgba(20,15,10,.09),
      transparent 30%
    );

  pointer-events:none;
}


/* ==================================================
   MOBILE / TABLET
================================================== */

@media(max-width:1100px){

  .header{
    height:78px;

    padding:
      0
      18px;
  }


  .logo img{
    width:72px;
  }


  .pc-nav,
  .header-reserve{
    display:none;
  }


  .menu-btn{
    display:flex;
  }


  /*
    縦画面は
    ヘッダー → 動画
  */

  .hero{
    display:block;

    min-height:auto;
  }


  .hero-copy{
    display:none;
  }


  .hero-video{
    min-height:0;

    width:100%;

    aspect-ratio:9 / 16;
  }


  .hero-video video{
    width:100%;
    height:100%;

    object-fit:cover;
  }


  /*
    スマホ縦では
    動画の上にコピー
  */

  .hero-video::before{
    content:"";

    position:absolute;

    inset:0;

    z-index:2;

    background:
      linear-gradient(
        to bottom,

        transparent 0%,
        transparent 57%,

        rgba(20,14,10,.12) 66%,

        rgba(20,14,10,.68) 100%
      );

    pointer-events:none;
  }


  .mobile-copy{
    display:block;
  }

}


/* ==================================================
   MOBILE COPY
================================================== */

.mobile-copy{
  display:none;

  position:absolute;

  z-index:3;

  left:22px;
  right:14px;
  bottom:40px;

  color:#fff;

  text-align:left;
}


.mobile-en{
  margin-bottom:10px;

  font-size:9px;

  letter-spacing:.22em;

  line-height:1.4;
}


.mobile-title{
  margin-bottom:13px;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:
    clamp(20px,5.7vw,26px);

  font-weight:500;

  line-height:1.4;

  letter-spacing:.005em;

  white-space:nowrap;

  text-shadow:
    0 2px 12px rgba(0,0,0,.4);
}


.mobile-description{
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:13px;

  line-height:1.7;

  letter-spacing:.015em;

  text-shadow:
    0 2px 8px rgba(0,0,0,.45);
}


/* ==================================================
   MOBILE CTA
================================================== */

.mobile-bottom{
  display:none;
}


@media(max-width:1100px){

  .mobile-bottom{
    display:block;

    background:#f4efe6;

    padding:
      22px
      18px
      28px;
  }


  .mobile-buttons{
    display:grid;

    grid-template-columns:
      1fr
      1fr;

    gap:10px;
  }


  .mobile-buttons .btn{
    min-width:0;

    height:54px;

    padding:0 8px;

    font-size:13px;
  }


  .mobile-instagram{
    display:flex;
    justify-content:center;

    margin-top:20px;

    font-size:11px;

    letter-spacing:.08em;

    color:#756a62;
  }

}


/* ==================================================
   横向きスマホ・タブレット
================================================== */

@media(
  max-width:1100px
)
and
(orientation:landscape){

  .header{
    height:70px;
  }


  .logo img{
    width:62px;
  }


  /*
    横画面は
    PCみたいな2分割に戻す
  */

  .hero{
    min-height:
      calc(100svh - 70px);

    display:grid;

    grid-template-columns:
      48%
      52%;
  }


  .hero-copy{
    display:flex;

    padding:
      30px
      5vw;
  }


  .hero-en{
    margin-bottom:12px;

    font-size:8px;
  }


  .hero-title{
    font-size:
      clamp(25px,4vw,40px);

    line-height:1.35;

    margin-bottom:12px;
  }


  .hero-description{
    font-size:12px;

    line-height:1.6;

    margin-bottom:18px;
  }


  .hero-buttons{
    gap:8px;
  }


  .btn{
    min-width:120px;

    height:42px;

    font-size:12px;

    padding:0 14px;
  }


  .instagram-link{
    display:none;
  }


  .hero-video{
    width:100%;

    aspect-ratio:auto;

    min-height:
      calc(100svh - 70px);
  }


  .hero-video::before{
    display:none;
  }


  .mobile-copy{
    display:none;
  }


  .mobile-bottom{
    display:none;
  }

}


/* ==================================================
   MOBILE MENU
================================================== */

.mobile-menu{
  position:fixed;

  inset:0;

  z-index:1000;

  background:#f4efe6;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:27px;

  opacity:0;

  visibility:hidden;

  transition:.25s;
}


.mobile-menu.open{
  opacity:1;
  visibility:visible;
}


.menu-close{
  position:absolute;

  top:18px;
  right:18px;

  width:54px;
  height:54px;

  border:0;
  border-radius:50%;

  background:#fff;

  font-size:28px;

  cursor:pointer;
}


.mobile-menu-logo{
  width:110px;

  margin-bottom:8px;
}


.mobile-menu a{
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:19px;

  letter-spacing:.05em;
}


.mobile-menu .menu-reserve{
  margin-top:8px;

  width:210px;
  height:52px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:999px;

  background:#bd4d2d;

  color:#fff;

  font-family:
    "Noto Sans JP",
    sans-serif;

  font-size:14px;

  font-weight:700;
}

</style>
</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header class="header">

  <a
    href="#"
    class="logo"
  >
    <img
      src="sho.png"
      alt="炭火焼ホルモン 松楽"
    >
  </a>


  <nav class="pc-nav">

    <a href="#about">
      松楽について
    </a>

    <a href="#menu">
      お品書き
    </a>

    <a href="#access">
      店舗情報
    </a>

    <a
      href="https://www.instagram.com/shoraku.yamagata/"
      target="_blank"
      rel="noopener"
    >
      Instagram
    </a>

  </nav>


  <a
    class="header-reserve"
    href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
    target="_blank"
    rel="noopener"
  >
    ネット予約
  </a>


  <button
    class="menu-btn"
    id="menuOpen"
    aria-label="メニューを開く"
  >
    <span></span>
    <span></span>
  </button>

</header>



<!-- ==================================================
     HERO
================================================== -->

<section class="hero">


  <!-- COPY -->

  <div class="hero-copy">

    <p class="hero-en">
      SUMIBIYAKI HORUMON SHORAKU
    </p>


    <h1 class="hero-title">
      創業40年の味を、<br>
      七輪で。
    </h1>


    <p class="hero-description">
      自家製ダレと炭火で味わう、<br>
      松楽のホルモン。
    </p>


    <div class="hero-buttons">

      <a
        class="btn btn-main"
        href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
        target="_blank"
        rel="noopener"
      >
        ネット予約
      </a>


      <a
        class="btn btn-sub"
        href="tel:05017257888"
      >
        電話する
      </a>

    </div>


    <a
      class="instagram-link"
      href="https://www.instagram.com/shoraku.yamagata/"
      target="_blank"
      rel="noopener"
    >
      Instagram　@shoraku.yamagata
    </a>

  </div>



  <!-- VIDEO -->

  <div class="hero-video">

    <video
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
    >

      <source
        src="sho.mp4"
        type="video/mp4"
      >

    </video>



    <!-- スマホ縦だけ表示 -->

    <div class="mobile-copy">

      <p class="mobile-en">
        SUMIBIYAKI HORUMON SHORAKU
      </p>


      <h1 class="mobile-title">
        創業40年の味を、七輪で。
      </h1>


      <p class="mobile-description">
        自家製ダレと炭火で味わう、松楽のホルモン。
      </p>

    </div>

  </div>

</section>



<!-- ==================================================
     MOBILE BUTTONS
================================================== -->

<section class="mobile-bottom">

  <div class="mobile-buttons">

    <a
      class="btn btn-main"
      href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
      target="_blank"
      rel="noopener"
    >
      ネット予約
    </a>


    <a
      class="btn btn-sub"
      href="tel:05017257888"
    >
      電話する
    </a>

  </div>


  <a
    class="mobile-instagram"
    href="https://www.instagram.com/shoraku.yamagata/"
    target="_blank"
    rel="noopener"
  >
    Instagram　@shoraku.yamagata
  </a>

</section>



<!-- ==================================================
     MOBILE MENU
================================================== -->

<div
  class="mobile-menu"
  id="mobileMenu"
>

  <button
    class="menu-close"
    id="menuClose"
    aria-label="メニューを閉じる"
  >
    ×
  </button>


  <img
    src="sho.png"
    class="mobile-menu-logo"
    alt="松楽"
  >


  <a href="#about">
    松楽について
  </a>


  <a href="#menu">
    お品書き
  </a>


  <a href="#access">
    店舗情報
  </a>


  <a
    href="https://www.instagram.com/shoraku.yamagata/"
    target="_blank"
    rel="noopener"
  >
    Instagram
  </a>


  <a
    class="menu-reserve"
    href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
    target="_blank"
    rel="noopener"
  >
    ネット予約
  </a>

</div>



<script>

const menuOpen =
  document.getElementById("menuOpen");

const menuClose =
  document.getElementById("menuClose");

const mobileMenu =
  document.getElementById("mobileMenu");


menuOpen.addEventListener(
  "click",
  function(){

    mobileMenu.classList.add("open");

    document.body.style.overflow =
      "hidden";

  }
);


menuClose.addEventListener(
  "click",
  function(){

    mobileMenu.classList.remove("open");

    document.body.style.overflow =
      "";

  }
);


mobileMenu
  .querySelectorAll("a")
  .forEach(function(link){

    link.addEventListener(
      "click",
      function(){

        mobileMenu.classList.remove("open");

        document.body.style.overflow =
          "";

      }
    );

  });

</script>


</body>
</html>
