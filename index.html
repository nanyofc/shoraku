<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>炭火焼ホルモン 松楽｜山形駅前</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background:#f5f0e8;
  color:#1d1916;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}


/* =========================
   HEADER
========================= */

.header{
  position:absolute;
  top:0;
  left:0;

  width:100%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:24px 30px;

  z-index:100;
}

.logo img{
  display:block;
  width:96px;
  height:auto;
}

.pc-nav{
  display:flex;
  align-items:center;
  gap:32px;

  font-size:13px;
  font-weight:600;
  letter-spacing:.08em;
}

.pc-nav a{
  transition:opacity .25s;
}

.pc-nav a:hover{
  opacity:.55;
}

.reserve-header{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  height:48px;
  padding:0 24px;

  border-radius:999px;

  background:#b74a2d;
  color:#fff;

  font-size:13px;
  font-weight:700;
  letter-spacing:.05em;
}

.menu-btn{
  display:none;

  width:54px;
  height:54px;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.9);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  align-items:center;
  justify-content:center;
  flex-direction:column;

  gap:6px;

  cursor:pointer;
}

.menu-btn span{
  width:23px;
  height:2px;

  background:#181512;

  display:block;
}


/* =========================
   PC HERO
========================= */

.hero-pc{
  position:relative;

  min-height:100svh;

  display:grid;
  grid-template-columns:52% 48%;

  overflow:hidden;

  background:#f5f0e8;
}

.hero-pc-copy{
  position:relative;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:
    140px
    6vw
    80px
    8vw;
}

.hero-en{
  margin-bottom:28px;

  font-size:11px;
  letter-spacing:.3em;

  color:#8c604d;
}

.hero-pc-title{
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-weight:500;
  font-size:clamp(48px,5vw,78px);

  line-height:1.45;
  letter-spacing:.05em;

  margin-bottom:30px;
}

.hero-pc-description{
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:16px;
  line-height:2;

  color:#665a52;

  margin-bottom:38px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  height:54px;
  min-width:170px;

  padding:0 24px;

  display:inline-flex;
  justify-content:center;
  align-items:center;

  border-radius:999px;

  font-size:14px;
  font-weight:700;

  transition:
    transform .2s,
    opacity .2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-main{
  background:#b74a2d;
  color:#fff;
}

.btn-outline{
  border:1px solid rgba(0,0,0,.18);
  background:rgba(255,255,255,.45);
}

.pc-instagram{
  display:inline-block;

  margin-top:30px;

  font-size:12px;

  color:#756960;

  letter-spacing:.08em;
}

.hero-pc-video{
  position:relative;

  height:100svh;

  overflow:hidden;

  background:#111;
}

.hero-pc-video video{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
  object-position:center;
}

.hero-pc-video::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to right,
      rgba(25,20,15,.13),
      transparent 35%
    );

  pointer-events:none;
}


/* =========================
   MOBILE HERO
========================= */

.hero-mobile{
  display:none;
}


/* =========================
   MOBILE
========================= */

@media (max-width:767px){

  body{
    background:#f5f0e8;
  }

  .header{
    padding:18px 18px;
    align-items:flex-start;
  }

  .logo img{
    width:92px;
  }

  .pc-nav,
  .reserve-header{
    display:none;
  }

  .menu-btn{
    display:flex;

    width:58px;
    height:58px;
  }

  .hero-pc{
    display:none;
  }

  .hero-mobile{
    display:block;

    position:relative;

    width:100%;

    background:#f5f0e8;
  }

  .hero-video-mobile{
    position:relative;

    width:100%;
    height:100svh;

    overflow:hidden;

    background:#111;
  }

  .hero-video-mobile video{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
  }

  .hero-video-mobile::after{
    content:"";

    position:absolute;
    inset:0;

    background:
      linear-gradient(
        to bottom,
        rgba(0,0,0,.10) 0%,
        rgba(0,0,0,0) 30%,
        rgba(0,0,0,0) 55%,
        rgba(0,0,0,.62) 100%
      );

    pointer-events:none;
  }


  /* =========================
     MOBILE COPY
  ========================= */

  .mobile-copy{
    position:absolute;

    left:24px;
    right:24px;
    bottom:50px;

    z-index:3;

    color:#fff;

    text-align:left;
  }

  .mobile-en{
    margin-bottom:10px;

    font-size:9px;
    letter-spacing:.22em;

    line-height:1.5;

    opacity:.9;
  }

  .mobile-title{
    font-family:
      "Yu Mincho",
      "Hiragino Mincho ProN",
      serif;

    font-size:30px;
    font-weight:500;

    line-height:1.45;
    letter-spacing:.03em;

    margin-bottom:12px;

    text-shadow:
      0 2px 12px rgba(0,0,0,.45);
  }

  .mobile-description{
    font-family:
      "Yu Mincho",
      "Hiragino Mincho ProN",
      serif;

    font-size:13px;

    line-height:1.7;
    letter-spacing:.03em;

    opacity:.95;

    text-shadow:
      0 2px 8px rgba(0,0,0,.4);
  }


  /* =========================
     MOBILE CTA
  ========================= */

  .mobile-actions{
    padding:24px 18px 12px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:10px;
  }

  .mobile-actions .btn{
    min-width:0;
    height:54px;

    padding:0 10px;

    font-size:13px;
  }

  .instagram-mobile{
    display:flex;

    align-items:center;
    justify-content:center;

    padding:12px 20px 30px;

    font-size:11px;
    letter-spacing:.08em;

    color:#71675f;
  }
}


/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
  position:fixed;
  inset:0;

  z-index:9999;

  background:#f5f0e8;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:26px;

  opacity:0;
  visibility:hidden;

  transition:
    opacity .3s,
    visibility .3s;
}

.mobile-menu.open{
  opacity:1;
  visibility:visible;
}

.mobile-menu-logo{
  width:120px;
  margin-bottom:10px;
}

.mobile-menu a:not(.menu-reserve){
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:19px;
  letter-spacing:.06em;
}

.menu-close{
  position:absolute;

  top:20px;
  right:20px;

  width:56px;
  height:56px;

  border:0;

  background:#fff;

  border-radius:50%;

  font-size:29px;

  cursor:pointer;
}

.menu-reserve{
  margin-top:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  width:210px;
  height:54px;

  border-radius:999px;

  background:#b74a2d;
  color:#fff;

  font-size:14px;
  font-weight:700;
}
</style>
</head>


<body>


<header class="header">

  <a href="#" class="logo">
    <img src="sho.png" alt="炭火焼ホルモン 松楽">
  </a>


  <nav class="pc-nav">

    <a href="#about">松楽について</a>

    <a href="#menu">お品書き</a>

    <a href="#access">店舗情報</a>

    <a
      href="https://www.instagram.com/shoraku.yamagata/"
      target="_blank"
      rel="noopener"
    >
      Instagram
    </a>

  </nav>


  <a
    class="reserve-header"
    href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
    target="_blank"
    rel="noopener"
  >
    ネット予約
  </a>


  <button
    class="menu-btn"
    id="menuOpen"
    aria-label="メニューを開く"
  >
    <span></span>
    <span></span>
  </button>

</header>



<section class="hero-pc">

  <div class="hero-pc-copy">

    <p class="hero-en">
      SUMIBIYAKI HORUMON SHORAKU
    </p>


    <h1 class="hero-pc-title">
      創業40年の味を、<br>
      七輪で。
    </h1>


    <p class="hero-pc-description">
      自家製ダレと炭火で味わう、<br>
      松楽のホルモン。
    </p>


    <div class="hero-buttons">

      <a
        class="btn btn-main"
        href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
        target="_blank"
        rel="noopener"
      >
        ネット予約
      </a>


      <a
        class="btn btn-outline"
        href="tel:05017257888"
      >
        電話する
      </a>

    </div>


    <a
      class="pc-instagram"
      href="https://www.instagram.com/shoraku.yamagata/"
      target="_blank"
      rel="noopener"
    >
      Instagram　@shoraku.yamagata
    </a>

  </div>


  <div class="hero-pc-video">

    <video
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
    >
      <source src="sho.mp4" type="video/mp4">
    </video>

  </div>

</section>



<section class="hero-mobile">

  <div class="hero-video-mobile">

    <video
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
    >
      <source src="sho.mp4" type="video/mp4">
    </video>


    <div class="mobile-copy">

      <p class="mobile-en">
        SUMIBIYAKI HORUMON SHORAKU
      </p>

      <h1 class="mobile-title">
        創業40年の味を、<br>
        七輪で。
      </h1>

      <p class="mobile-description">
        自家製ダレと炭火で味わう、松楽のホルモン。
      </p>

    </div>

  </div>


  <div class="mobile-actions">

    <a
      class="btn btn-main"
      href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
      target="_blank"
      rel="noopener"
    >
      ネット予約
    </a>


    <a
      class="btn btn-outline"
      href="tel:05017257888"
    >
      電話する
    </a>

  </div>


  <a
    class="instagram-mobile"
    href="https://www.instagram.com/shoraku.yamagata/"
    target="_blank"
    rel="noopener"
  >
    Instagram　@shoraku.yamagata
  </a>

</section>



<div
  class="mobile-menu"
  id="mobileMenu"
>

  <button
    class="menu-close"
    id="menuClose"
    aria-label="メニューを閉じる"
  >
    ×
  </button>


  <img
    class="mobile-menu-logo"
    src="sho.png"
    alt="松楽"
  >


  <a href="#about">
    松楽について
  </a>


  <a href="#menu">
    お品書き
  </a>


  <a href="#access">
    店舗情報
  </a>


  <a
    href="https://www.instagram.com/shoraku.yamagata/"
    target="_blank"
    rel="noopener"
  >
    Instagram
  </a>


  <a
    class="menu-reserve"
    href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
    target="_blank"
    rel="noopener"
  >
    ネット予約
  </a>

</div>



<script>
const menuOpen =
  document.getElementById("menuOpen");

const menuClose =
  document.getElementById("menuClose");

const mobileMenu =
  document.getElementById("mobileMenu");


menuOpen.addEventListener(
  "click",
  function(){

    mobileMenu.classList.add("open");

    document.body.style.overflow =
      "hidden";

  }
);


menuClose.addEventListener(
  "click",
  function(){

    mobileMenu.classList.remove("open");

    document.body.style.overflow =
      "";

  }
);


mobileMenu
  .querySelectorAll("a")
  .forEach(function(link){

    link.addEventListener(
      "click",
      function(){

        mobileMenu.classList.remove("open");

        document.body.style.overflow =
          "";

      }
    );

  });
</script>


</body>
</html>
