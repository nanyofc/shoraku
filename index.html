<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>炭火焼ホルモン 松楽｜山形駅前</title>

<style>

/* ==========================================
   RESET
========================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #f4efe6;
  color: #211c18;

  font-family:
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
}


/* ==========================================
   HEADER
========================================== */

.header {
  position: relative;
  z-index: 100;

  width: 100%;
  height: 94px;

  display: flex;
  align-items: center;

  padding: 0 5vw;

  background: #f4efe6;

  border-bottom:
    1px solid rgba(40,30,20,.08);
}


/* LOGO */

.logo {
  flex-shrink: 0;
}

.logo img {
  display: block;

  width: 88px;
  height: auto;
}


/* PC NAV */

.pc-nav {
  margin-left: auto;

  display: flex;
  align-items: center;

  gap: 34px;

  font-size: 14px;
  font-weight: 600;

  letter-spacing: .06em;
}

.pc-nav a {
  transition: opacity .2s;
}

.pc-nav a:hover {
  opacity: .55;
}


/* PC予約 */

.header-reserve {
  margin-left: 32px;

  display: flex;
  align-items: center;
  justify-content: center;

  height: 50px;

  padding: 0 26px;

  border-radius: 999px;

  background: #bd4d2d;
  color: #fff;

  font-size: 14px;
  font-weight: 700;
}


/* ==========================================
   HAMBURGER
========================================== */

.menu-btn {
  display: none;

  margin-left: auto;

  width: 58px;
  height: 58px;

  border: 0;
  border-radius: 50%;

  background: #fff;

  box-shadow:
    0 5px 20px rgba(0,0,0,.06);

  align-items: center;
  justify-content: center;

  flex-direction: column;

  gap: 6px;

  cursor: pointer;
}

.menu-btn span {
  display: block;

  width: 24px;
  height: 2px;

  background: #211c18;
}


/* ==========================================
   HERO PC
========================================== */

.hero {
  width: 100%;

  min-height:
    calc(100svh - 94px);

  display: grid;

  grid-template-columns:
    52% 48%;

  background: #f4efe6;
}


/* LEFT */

.hero-copy {
  display: flex;
  flex-direction: column;
  justify-content: center;

  padding:
    70px
    7vw
    70px
    8vw;
}


.hero-en {
  margin-bottom: 26px;

  font-size: 11px;

  letter-spacing: .30em;

  color: #93624d;
}


.hero-title {
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:
    clamp(44px,5vw,74px);

  font-weight: 500;

  line-height: 1.4;

  letter-spacing: .03em;

  margin-bottom: 24px;
}


.hero-description {
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size: 16px;

  line-height: 1.9;

  color: #645950;

  margin-bottom: 35px;
}


/* BUTTON */

.hero-buttons {
  display: flex;

  gap: 12px;

  flex-wrap: wrap;
}


.btn {
  min-width: 170px;
  height: 54px;

  padding: 0 24px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 999px;

  font-size: 14px;
  font-weight: 700;

  transition:
    transform .2s,
    opacity .2s;
}

.btn:hover {
  transform: translateY(-2px);
}


.btn-main {
  background: #bd4d2d;
  color: #fff;
}


.btn-sub {
  background: transparent;

  border:
    1px solid rgba(40,30,20,.20);
}


.instagram-link {
  margin-top: 27px;

  font-size: 12px;

  letter-spacing: .09em;

  color: #756a62;
}


/* ==========================================
   VIDEO
========================================== */

.hero-video {
  position: relative;

  min-height:
    calc(100svh - 94px);

  overflow: hidden;

  background: #111;
}


.hero-video video {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;
}


/* ==========================================
   MOBILE COPY
========================================== */

.mobile-copy {
  display: none;

  position: absolute;

  z-index: 5;

  left: 22px;
  right: 16px;
  bottom: 42px;

  color: #fff;

  text-align: left;
}


.mobile-en {
  margin-bottom: 10px;

  font-size: 9px;

  letter-spacing: .22em;

  line-height: 1.4;
}


.mobile-title {
  margin-bottom: 13px;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:
    clamp(20px,5.7vw,26px);

  font-weight: 500;

  line-height: 1.4;

  letter-spacing: 0;

  white-space: nowrap;

  text-shadow:
    0 2px 12px rgba(0,0,0,.45);
}


.mobile-description {
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size: 13px;

  line-height: 1.7;

  letter-spacing: .015em;

  text-shadow:
    0 2px 8px rgba(0,0,0,.5);
}


/* ==========================================
   MOBILE BOTTOM
========================================== */

.mobile-bottom {
  display: none;
}


/* ==========================================
   TABLET / MOBILE
========================================== */

@media (max-width: 1100px) {

  /* HEADER */

  .header {
    height: 78px;

    padding:
      0
      18px;

    background: #f4efe6;
  }

  .logo img {
    width: 72px;
  }

  .pc-nav,
  .header-reserve {
    display: none;
  }

  .menu-btn {
    display: flex;
  }


  /* HERO */

  .hero {
    display: block;

    min-height: auto;
  }

  .hero-copy {
    display: none;
  }

  .hero-video {
    width: 100%;

    height:
      calc(100svh - 78px);

    min-height: 0;
  }

  .hero-video video {
    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;
  }


  /* VIDEO DARK GRADIENT */

  .hero-video::after {
    content: "";

    position: absolute;

    z-index: 2;

    inset: 0;

    background:
      linear-gradient(
        to bottom,

        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0) 55%,
        rgba(20,14,10,.15) 68%,
        rgba(20,14,10,.70) 100%
      );

    pointer-events: none;
  }


  /* ここを必ず表示 */

  .mobile-copy {
    display: block;
  }


  /* MOBILE BOTTOM */

  .mobile-bottom {
    display: block;

    background: #f4efe6;

    padding:
      22px
      18px
      28px;
  }


  .mobile-buttons {
    display: grid;

    grid-template-columns:
      1fr 1fr;

    gap: 10px;
  }


  .mobile-buttons .btn {
    min-width: 0;

    height: 54px;

    padding: 0 8px;

    font-size: 13px;
  }


  .mobile-instagram {
    display: flex;

    justify-content: center;

    margin-top: 20px;

    font-size: 11px;

    letter-spacing: .08em;

    color: #756a62;
  }

}


/* ==========================================
   横向きスマホ / タブレット
========================================== */

@media (max-width: 1100px) and (orientation: landscape) {

  .header {
    height: 70px;
  }

  .logo img {
    width: 62px;
  }


  /* 横画面は2カラム */

  .hero {
    min-height:
      calc(100svh - 70px);

    display: grid;

    grid-template-columns:
      48% 52%;
  }


  .hero-copy {
    display: flex;

    padding:
      25px
      5vw;
  }


  .hero-en {
    margin-bottom: 12px;

    font-size: 8px;
  }


  .hero-title {
    font-size:
      clamp(26px,4vw,40px);

    line-height: 1.35;

    margin-bottom: 12px;
  }


  .hero-description {
    font-size: 12px;

    line-height: 1.6;

    margin-bottom: 18px;
  }


  .hero-buttons {
    gap: 8px;
  }


  .btn {
    min-width: 120px;

    height: 42px;

    padding: 0 14px;

    font-size: 12px;
  }


  .instagram-link {
    display: none;
  }


  .hero-video {
    height:
      calc(100svh - 70px);

    min-height: 0;
  }


  .hero-video::after {
    display: none;
  }


  .mobile-copy {
    display: none;
  }


  .mobile-bottom {
    display: none;
  }

}


/* ==========================================
   MOBILE MENU
========================================== */

.mobile-menu {
  position: fixed;

  inset: 0;

  z-index: 1000;

  background: #f4efe6;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 27px;

  opacity: 0;

  visibility: hidden;

  transition: .25s;
}


.mobile-menu.open {
  opacity: 1;

  visibility: visible;
}


.menu-close {
  position: absolute;

  top: 18px;
  right: 18px;

  width: 54px;
  height: 54px;

  border: 0;
  border-radius: 50%;

  background: #fff;

  font-size: 28px;

  cursor: pointer;
}


.mobile-menu-logo {
  width: 110px;

  margin-bottom: 8px;
}


.mobile-menu a {
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size: 19px;

  letter-spacing: .05em;
}


.mobile-menu .menu-reserve {
  margin-top: 8px;

  width: 210px;
  height: 52px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 999px;

  background: #bd4d2d;

  color: #fff;

  font-family:
    "Noto Sans JP",
    sans-serif;

  font-size: 14px;

  font-weight: 700;
}

</style>
</head>
