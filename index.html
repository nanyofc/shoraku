<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>炭火焼ホルモン 松楽 | 山形駅前</title>

<style>

/* =========================
   RESET
========================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  color:#191714;
  background:#f5f0e7;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}


/* =========================
   HEADER
========================= */

.header{
  position:absolute;
  top:0;
  left:0;

  width:100%;
  height:84px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 5vw;

  z-index:100;
}

.header-logo img{
  display:block;
  width:82px;
  height:auto;
}


/* PC MENU */

.pc-nav{
  display:flex;
  align-items:center;
  gap:32px;

  font-size:13px;
  font-weight:600;
  letter-spacing:.08em;
}

.pc-nav a{
  position:relative;
}

.pc-nav a::after{
  content:"";
  position:absolute;

  left:0;
  bottom:-7px;

  width:0;
  height:1px;

  background:#191714;

  transition:.3s;
}

.pc-nav a:hover::after{
  width:100%;
}


/* 予約ボタン */

.header-reserve{
  padding:13px 22px;

  color:#fff;
  background:#b74b2d;

  border-radius:999px;

  font-size:13px;
  font-weight:700;

  transition:.25s;
}

.header-reserve:hover{
  transform:translateY(-2px);
}


/* MOBILE MENU BUTTON */

.menu-button{
  display:none;

  width:48px;
  height:48px;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.88);

  align-items:center;
  justify-content:center;
  flex-direction:column;

  gap:5px;

  cursor:pointer;
}

.menu-button span{
  display:block;

  width:21px;
  height:1.5px;

  background:#191714;
}


/* =========================
   PC HERO
========================= */

.hero-pc{
  min-height:100svh;

  display:grid;
  grid-template-columns:1fr 46%;

  align-items:center;

  position:relative;

  padding:120px 7vw 70px;

  overflow:hidden;
}


/* 背景装飾 */

.hero-pc::before{
  content:"";

  position:absolute;

  width:500px;
  height:500px;

  border:1px solid rgba(0,0,0,.07);
  border-radius:50%;

  left:-210px;
  bottom:-170px;
}


/* LEFT */

.hero-copy{
  position:relative;
  z-index:2;

  max-width:620px;
}

.hero-small{
  margin-bottom:24px;

  font-family:serif;
  font-size:12px;
  letter-spacing:.28em;

  color:#8b5b45;
}

.hero-copy h1{
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:clamp(46px,5vw,78px);
  font-weight:500;

  line-height:1.28;
  letter-spacing:.04em;

  margin-bottom:25px;
}

.hero-copy h1 span{
  display:block;
}

.hero-description{
  font-size:15px;
  line-height:2;

  color:#655c55;

  margin-bottom:37px;
}


/* CTA */

.hero-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  min-width:172px;

  height:54px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:999px;

  font-size:14px;
  font-weight:700;

  letter-spacing:.05em;

  transition:.25s;
}

.btn-main{
  color:#fff;
  background:#b74b2d;
}

.btn-sub{
  border:1px solid rgba(0,0,0,.18);
  background:rgba(255,255,255,.55);
}

.btn:hover{
  transform:translateY(-2px);
}


/* INSTAGRAM */

.instagram-link{
  display:inline-flex;
  align-items:center;

  margin-top:28px;

  font-size:12px;
  letter-spacing:.1em;

  color:#6b625d;
}


/* =========================
   PC VIDEO
========================= */

.hero-media{
  position:relative;

  display:flex;
  justify-content:center;
  align-items:center;
}

.video-wrap{
  position:relative;

  width:min(390px,30vw);
  aspect-ratio:9 / 16;

  overflow:hidden;

  border-radius:180px 180px 30px 30px;

  box-shadow:
    0 30px 80px rgba(47,34,26,.20);

  background:#000;
}

.video-wrap video{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}


/* 動画後ろのオレンジ */

.video-accent{
  position:absolute;

  width:min(390px,30vw);
  aspect-ratio:9 / 16;

  border:1px solid rgba(183,75,45,.35);

  border-radius:180px 180px 30px 30px;

  transform:translate(26px,26px);

  z-index:-1;
}


/* 小さい縦文字 */

.hero-side-text{
  position:absolute;

  right:-10px;
  bottom:50px;

  writing-mode:vertical-rl;

  font-family:serif;

  font-size:11px;
  letter-spacing:.25em;

  color:#8e8178;
}


/* =========================
   MOBILE HERO
========================= */

.hero-mobile{
  display:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:767px){

  body{
    background:#f5f0e7;
  }

  /* HEADER */

  .header{
    position:absolute;

    height:72px;
    padding:0 16px;

    background:
      linear-gradient(
        to bottom,
        rgba(255,255,255,.90),
        rgba(255,255,255,.55),
        transparent
      );
  }

  .header-logo img{
    width:64px;
  }

  .pc-nav,
  .header-reserve{
    display:none;
  }

  .menu-button{
    display:flex;
  }


  /* PC HERO HIDE */

  .hero-pc{
    display:none;
  }


  /* MOBILE HERO */

  .hero-mobile{
    display:block;

    min-height:100svh;

    position:relative;

    padding-bottom:40px;
  }

  .mobile-video{
    width:100%;
    aspect-ratio:9 / 16;

    position:relative;

    overflow:hidden;

    background:#111;
  }

  .mobile-video video{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
  }


  /* 下グラデーション */

  .mobile-video::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:42%;

    background:
      linear-gradient(
        to bottom,
        transparent,
        rgba(15,11,8,.70)
      );

    pointer-events:none;
  }


  /* 動画上コピー */

  .mobile-copy{
    position:absolute;

    left:22px;
    right:22px;
    bottom:30px;

    color:#fff;

    z-index:2;
  }

  .mobile-copy .small{
    font-size:10px;
    letter-spacing:.22em;

    margin-bottom:9px;

    opacity:.9;
  }

  .mobile-copy h1{
    font-family:
      "Yu Mincho",
      "Hiragino Mincho ProN",
      serif;

    font-size:31px;
    line-height:1.45;
    font-weight:500;

    letter-spacing:.04em;
  }


  /* MOBILE CTA */

  .mobile-actions{
    padding:22px 18px 0;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:10px;
  }

  .mobile-actions .btn{
    min-width:0;

    height:52px;

    font-size:13px;
  }

  .mobile-instagram{
    display:flex;
    justify-content:center;

    padding-top:19px;

    font-size:11px;
    letter-spacing:.1em;

    color:#71655d;
  }

}


/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
  position:fixed;

  inset:0;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  gap:28px;

  background:#f5f0e7;

  opacity:0;
  visibility:hidden;

  transition:.3s;

  z-index:999;
}

.mobile-menu.open{
  opacity:1;
  visibility:visible;
}

.mobile-menu-logo{
  width:100px;

  margin-bottom:10px;
}

.mobile-menu a{
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:19px;
}

.menu-close{
  position:absolute;

  top:18px;
  right:18px;

  width:48px;
  height:48px;

  border:0;
  border-radius:50%;

  background:#fff;

  font-size:28px;

  cursor:pointer;
}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <a class="header-logo" href="#">
    <img src="sho.png" alt="炭火焼ホルモン 松楽">
  </a>


  <nav class="pc-nav">

    <a href="#">松楽について</a>

    <a href="#menu">お品書き</a>

    <a href="#access">店舗情報</a>

    <a
      href="https://www.instagram.com/shoraku.yamagata/"
      target="_blank"
      rel="noopener"
    >
      Instagram
    </a>

  </nav>


  <a
    class="header-reserve"
    href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
    target="_blank"
    rel="noopener"
  >
    ネット予約
  </a>


  <button
    class="menu-button"
    id="menuOpen"
    aria-label="メニューを開く"
  >
    <span></span>
    <span></span>
  </button>

</header>


<!-- =========================
     PC HERO
========================= -->

<section class="hero-pc">

  <div class="hero-copy">

    <p class="hero-small">
      SUMIBIYAKI HORUMON SHORAKU
    </p>


    <h1>
      <span>炙って、飲んで、</span>
      <span>ほどける夜。</span>
    </h1>


    <p class="hero-description">
      七輪を囲んで、気取らず一杯。<br>
      山形駅前で楽しむ、炭火焼ホルモンと酒。
    </p>


    <div class="hero-actions">

      <a
        class="btn btn-main"
        href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
        target="_blank"
        rel="noopener"
      >
        ネット予約
      </a>


      <a
        class="btn btn-sub"
        href="tel:05017257888"
      >
        電話する
      </a>

    </div>


    <a
      class="instagram-link"
      href="https://www.instagram.com/shoraku.yamagata/"
      target="_blank"
      rel="noopener"
    >
      Instagram　@shoraku.yamagata
    </a>

  </div>


  <div class="hero-media">

    <div class="video-accent"></div>

    <div class="video-wrap">

      <video
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
      >
        <source src="sho.mp4" type="video/mp4">
      </video>

    </div>

    <p class="hero-side-text">
      炭火焼ホルモンと酒
    </p>

  </div>

</section>



<!-- =========================
     MOBILE HERO
========================= -->

<section class="hero-mobile">

  <div class="mobile-video">

    <video
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
    >
      <source src="sho.mp4" type="video/mp4">
    </video>


    <div class="mobile-copy">

      <p class="small">
        SUMIBIYAKI HORUMON SHORAKU
      </p>

      <h1>
        炙って、飲んで、<br>
        ほどける夜。
      </h1>

    </div>

  </div>


  <div class="mobile-actions">

    <a
      class="btn btn-main"
      href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
      target="_blank"
      rel="noopener"
    >
      ネット予約
    </a>


    <a
      class="btn btn-sub"
      href="tel:05017257888"
    >
      電話する
    </a>

  </div>


  <a
    class="mobile-instagram"
    href="https://www.instagram.com/shoraku.yamagata/"
    target="_blank"
    rel="noopener"
  >
    Instagram　@shoraku.yamagata
  </a>

</section>



<!-- =========================
     MOBILE MENU
========================= -->

<div class="mobile-menu" id="mobileMenu">

  <button
    class="menu-close"
    id="menuClose"
    aria-label="メニューを閉じる"
  >
    ×
  </button>


  <img
    class="mobile-menu-logo"
    src="sho.png"
    alt="松楽"
  >


  <a href="#">松楽について</a>

  <a href="#menu">お品書き</a>

  <a href="#access">店舗情報</a>

  <a
    href="https://www.instagram.com/shoraku.yamagata/"
    target="_blank"
    rel="noopener"
  >
    Instagram
  </a>


  <a
    class="btn btn-main"
    href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
    target="_blank"
    rel="noopener"
  >
    ネット予約
  </a>

</div>



<script>

/* =========================
   MOBILE MENU
========================= */

const mobileMenu = document.getElementById("mobileMenu");
const menuOpen = document.getElementById("menuOpen");
const menuClose = document.getElementById("menuClose");

menuOpen.addEventListener("click", () => {

  mobileMenu.classList.add("open");

  document.body.style.overflow = "hidden";

});


menuClose.addEventListener("click", () => {

  mobileMenu.classList.remove("open");

  document.body.style.overflow = "";

});


mobileMenu.querySelectorAll("a").forEach(link => {

  link.addEventListener("click", () => {

    mobileMenu.classList.remove("open");

    document.body.style.overflow = "";

  });

});

</script>


</body>
</html>
