<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>炭火焼ホルモン 松楽｜山形駅前</title>

<style>

/* ==================================================
   RESET
================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#f7f3ed;
  color:#211c18;

  font-family:
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}


/* ==================================================
   HEADER
================================================== */

.header{
  position:relative;
  z-index:100;

  width:100%;
  height:96px;

  display:flex;
  align-items:center;

  padding:0 5vw;

  /* かなり薄いピンク */
  background:#fff8fa;

  border-bottom:
    1px solid rgba(60,40,40,.05);
}


/* LOGO */

.logo{
  flex-shrink:0;
}

.logo img{
  display:block;

  width:86px;
  height:auto;
}


/* ==================================================
   PC NAV
================================================== */

.pc-nav{
  margin-left:auto;

  display:flex;
  align-items:center;

  gap:34px;

  font-size:14px;
  font-weight:600;

  letter-spacing:.05em;
}

.pc-nav a{
  transition:opacity .2s;
}

.pc-nav a:hover{
  opacity:.55;
}


/* PC予約 */

.header-reserve{
  margin-left:32px;

  height:50px;

  padding:0 27px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:999px;

  background:#bd4d2d;
  color:#fff;

  font-size:14px;
  font-weight:700;
}


/* ==================================================
   HAMBURGER
================================================== */

.menu-btn{
  display:none;

  margin-left:auto;

  width:58px;
  height:58px;

  border:0;
  border-radius:50%;

  background:#fff;

  box-shadow:
    0 5px 18px rgba(0,0,0,.06);

  align-items:center;
  justify-content:center;
  flex-direction:column;

  gap:6px;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}


/* 3本線 */

.menu-btn span{
  display:block;

  width:24px;
  height:2px;

  border-radius:10px;

  background:#211c18;
}


/* ==================================================
   HERO
================================================== */

.hero{
  width:100%;

  min-height:
    calc(100svh - 96px);

  display:grid;

  grid-template-columns:
    50% 50%;

  background:#f7f3ed;
}


/* ==================================================
   HERO COPY
================================================== */

.hero-copy{
  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:
    65px
    7vw
    65px
    8vw;
}


.hero-en{
  margin-bottom:25px;

  font-size:11px;

  letter-spacing:.30em;

  color:#93624d;
}


.hero-title{
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:
    clamp(44px,4.8vw,72px);

  font-weight:500;

  line-height:1.4;

  letter-spacing:.025em;

  margin-bottom:23px;
}


.hero-description{
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:16px;

  line-height:1.9;

  color:#665a51;

  margin-bottom:34px;
}


/* ==================================================
   BUTTON
================================================== */

.hero-buttons{
  display:flex;

  gap:12px;

  flex-wrap:wrap;
}


.btn{
  min-width:170px;
  height:54px;

  padding:0 24px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:999px;

  font-size:14px;
  font-weight:700;

  transition:
    transform .2s,
    opacity .2s;
}


.btn:hover{
  transform:translateY(-2px);
}


.btn-main{
  background:#bd4d2d;
  color:#fff;
}


.btn-sub{
  background:transparent;

  border:
    1px solid rgba(40,30,20,.20);
}


.instagram-link{
  margin-top:27px;

  font-size:12px;

  letter-spacing:.08em;

  color:#756a62;
}


/* ==================================================
   VIDEO
================================================== */

.hero-video{
  position:relative;

  min-height:
    calc(100svh - 96px);

  overflow:hidden;

  background:#111;
}


.hero-video video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
  object-position:center;
}


/* ==================================================
   MOBILE COPY
================================================== */

.mobile-copy{
  display:none;

  position:absolute;

  z-index:5;

  left:22px;
  right:14px;
  bottom:42px;

  color:#fff;

  text-align:left;
}


.mobile-en{
  margin-bottom:10px;

  font-size:9px;

  line-height:1.4;

  letter-spacing:.22em;

  opacity:.95;
}


.mobile-title{
  margin-bottom:13px;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:
    clamp(19px,5.5vw,24px);

  font-weight:500;

  line-height:1.4;

  letter-spacing:0;

  white-space:nowrap;

  text-shadow:
    0 2px 12px rgba(0,0,0,.5);
}


.mobile-description{
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:13px;

  line-height:1.7;

  letter-spacing:.01em;

  text-shadow:
    0 2px 9px rgba(0,0,0,.55);
}


/* ==================================================
   MOBILE BOTTOM
================================================== */

.mobile-bottom{
  display:none;
}


/* ==================================================
   MOBILE / TABLET
================================================== */

@media(max-width:1100px){

  /* HEADER */

  .header{
    height:82px;

    padding:0 18px;

    background:#fff8fa;
  }


  .logo img{
    width:72px;
  }


  .pc-nav,
  .header-reserve{
    display:none;
  }


  .menu-btn{
    display:flex;
  }


  /* HERO */

  .hero{
    display:block;

    min-height:auto;
  }


  .hero-copy{
    display:none;
  }


  .hero-video{
    width:100%;

    height:
      calc(100svh - 82px);

    min-height:0;
  }


  .hero-video video{
    object-fit:cover;
    object-position:center;
  }


  /* 動画下部グラデーション */

  .hero-video::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:2;

    background:
      linear-gradient(
        to bottom,

        rgba(0,0,0,0) 0%,

        rgba(0,0,0,0) 50%,

        rgba(20,14,10,.12) 65%,

        rgba(20,14,10,.72) 100%
      );

    pointer-events:none;
  }


  /* スマホコピー */

  .mobile-copy{
    display:block;
  }


  /* 下ボタン */

  .mobile-bottom{
    display:block;

    background:#f7f3ed;

    padding:
      22px
      18px
      28px;
  }


  .mobile-buttons{
    display:grid;

    grid-template-columns:
      1fr 1fr;

    gap:10px;
  }


  .mobile-buttons .btn{
    min-width:0;

    height:54px;

    padding:0 8px;

    font-size:13px;
  }


  .mobile-instagram{
    display:flex;

    justify-content:center;

    margin-top:20px;

    font-size:11px;

    letter-spacing:.08em;

    color:#756a62;
  }

}


/* ==================================================
   横向きスマホ / タブレット
================================================== */

@media(max-width:1100px) and (orientation:landscape){

  .header{
    height:70px;

    padding:0 20px;
  }


  .logo img{
    width:58px;
  }


  .menu-btn{
    width:50px;
    height:50px;
  }


  .hero{
    display:grid;

    grid-template-columns:
      48% 52%;

    min-height:
      calc(100svh - 70px);
  }


  .hero-copy{
    display:flex;

    padding:
      25px
      5vw;
  }


  .hero-en{
    margin-bottom:12px;

    font-size:8px;
  }


  .hero-title{
    font-size:
      clamp(25px,4vw,40px);

    line-height:1.35;

    margin-bottom:12px;
  }


  .hero-description{
    font-size:12px;

    line-height:1.6;

    margin-bottom:18px;
  }


  .hero-buttons{
    gap:8px;
  }


  .btn{
    min-width:120px;

    height:42px;

    padding:0 14px;

    font-size:12px;
  }


  .instagram-link{
    display:none;
  }


  .hero-video{
    height:
      calc(100svh - 70px);

    min-height:0;
  }


  .hero-video::after{
    display:none;
  }


  .mobile-copy{
    display:none;
  }


  .mobile-bottom{
    display:none;
  }

}


/* ==================================================
   MOBILE MENU
================================================== */

.mobile-menu{
  position:fixed;

  inset:0;

  z-index:9999;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:27px;

  background:#fff8fa;

  opacity:0;

  visibility:hidden;

  pointer-events:none;

  transition:
    opacity .25s,
    visibility .25s;
}


.mobile-menu.open{
  opacity:1;

  visibility:visible;

  pointer-events:auto;
}


.menu-close{
  position:absolute;

  top:18px;
  right:18px;

  width:56px;
  height:56px;

  border:0;
  border-radius:50%;

  background:#fff;

  color:#211c18;

  font-size:30px;

  line-height:1;

  cursor:pointer;
}


.mobile-menu-logo{
  width:115px;

  margin-bottom:8px;
}


.mobile-menu a:not(.menu-reserve){
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size:19px;

  letter-spacing:.05em;
}


.mobile-menu .menu-reserve{
  margin-top:8px;

  width:210px;
  height:52px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:999px;

  background:#bd4d2d;

  color:#fff;

  font-size:14px;
  font-weight:700;
}

</style>
</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header class="header">

  <a href="#" class="logo">

    <img
      src="sho.png"
      alt="炭火焼ホルモン 松楽"
    >

  </a>


  <nav class="pc-nav">

    <a href="#about">
      松楽について
    </a>

    <a href="#menu">
      お品書き
    </a>

    <a href="#access">
      店舗情報
    </a>

    <!-- 同じ画面でInstagramへ -->

    <a href="https://www.instagram.com/shoraku.yamagata/">
      Instagram
    </a>

  </nav>


  <a
    class="header-reserve"
    href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
    target="_blank"
    rel="noopener"
  >
    ネット予約
  </a>


  <button
    class="menu-btn"
    type="button"
    onclick="openMenu()"
    aria-label="メニューを開く"
  >

    <span></span>
    <span></span>
    <span></span>

  </button>

</header>



<!-- ==================================================
     HERO
================================================== -->

<section class="hero">


  <!-- PC / 横画面 -->

  <div class="hero-copy">

    <p class="hero-en">
      SUMIBIYAKI HORUMON SHORAKU
    </p>


    <h1 class="hero-title">
      創業40年の味を、<br>
      七輪で。
    </h1>


    <p class="hero-description">
      自家製ダレと炭火で味わう、<br>
      松楽のホルモン。
    </p>


    <div class="hero-buttons">

      <a
        class="btn btn-main"
        href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
        target="_blank"
        rel="noopener"
      >
        ネット予約
      </a>


      <a
        class="btn btn-sub"
        href="tel:05017257888"
      >
        電話する
      </a>

    </div>


    <a
      class="instagram-link"
      href="https://www.instagram.com/shoraku.yamagata/"
    >
      Instagram　@shoraku.yamagata
    </a>

  </div>



  <!-- VIDEO -->

  <div class="hero-video">

    <video
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
    >

      <source
        src="sho.mp4"
        type="video/mp4"
      >

    </video>


    <!-- スマホ縦 COPY -->

    <div class="mobile-copy">

      <p class="mobile-en">
        SUMIBIYAKI HORUMON SHORAKU
      </p>


      <h1 class="mobile-title">
        創業40年の味を、七輪で。
      </h1>


      <p class="mobile-description">
        自家製ダレと炭火で味わう、松楽のホルモン。
      </p>

    </div>

  </div>

</section>



<!-- ==================================================
     MOBILE CTA
================================================== -->

<section class="mobile-bottom">

  <div class="mobile-buttons">

    <a
      class="btn btn-main"
      href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
      target="_blank"
      rel="noopener"
    >
      ネット予約
    </a>


    <a
      class="btn btn-sub"
      href="tel:05017257888"
    >
      電話する
    </a>

  </div>


  <a
    class="mobile-instagram"
    href="https://www.instagram.com/shoraku.yamagata/"
  >
    Instagram　@shoraku.yamagata
  </a>

</section>



<!-- ==================================================
     FULL SCREEN MENU
================================================== -->

<div
  class="mobile-menu"
  id="mobileMenu"
>

  <button
    class="menu-close"
    type="button"
    onclick="closeMenu()"
    aria-label="メニューを閉じる"
  >
    ×
  </button>


  <img
    src="sho.png"
    class="mobile-menu-logo"
    alt="松楽"
  >


  <a
    href="#about"
    onclick="closeMenu()"
  >
    松楽について
  </a>


  <a
    href="#menu"
    onclick="closeMenu()"
  >
    お品書き
  </a>


  <a
    href="#access"
    onclick="closeMenu()"
  >
    店舗情報
  </a>


  <!-- target blankを削除 -->

  <a
    href="https://www.instagram.com/shoraku.yamagata/"
  >
    Instagram
  </a>


  <a
    class="menu-reserve"
    href="https://yoyaku.tabelog.com/yoyaku/smartphone/net_booking_form/index?rcd=6013296"
    target="_blank"
    rel="noopener"
  >
    ネット予約
  </a>

</div>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>

function openMenu(){

  const menu =
    document.getElementById("mobileMenu");

  menu.classList.add("open");

  document.body.style.overflow =
    "hidden";
}


function closeMenu(){

  const menu =
    document.getElementById("mobileMenu");

  menu.classList.remove("open");

  document.body.style.overflow =
    "";
}

</script>


</body>
</html>
